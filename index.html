          </clipPath>
        </defs>

        <g clip-path="url(#satvik-liquid-clip)">
          <g class="liquid-loader__fill" transform="translate(0 196)">

          </g>
        </g>
      </svg>
      <div class="loading-screen__meta">loading... <span>0</span> %</div>
    </div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('page-loader');
      if (!loader) return;

      var fill = loader.querySelector('.liquid-loader__fill');
      var value = loader.querySelector('.loading-screen__meta span');
      var startedAt = performance.now();
      var duration = 2800;
      var removed = false;
      var completed = false;

      function removeLoader() {
        if (removed) return;
        removed = true;
        loader.classList.add('loading-screen--exit');
        window.setTimeout(function () {
          loader.remove();
        }, 240);
      }

      function tick(now) {
        var ratio = Math.min((now - startedAt) / duration, 1);
        var progress = Math.min(Math.round(ratio * 100), 100);

        if (fill) fill.setAttribute('transform', 'translate(0 ' + (196 - progress * 2.56).toFixed(2) + ')');
        if (value) value.textContent = String(progress);

        if (ratio < 1) {
          requestAnimationFrame(tick);
        } else if (!completed) {
          completed = true;
          loader.classList.add('loading-screen--complete');
          window.setTimeout(removeLoader, 980);
        }
      }

      requestAnimationFrame(tick);
      window.setTimeout(removeLoader, 4080);
      window.addEventListener('load', function () {
        var elapsed = performance.now() - startedAt;
        window.setTimeout(removeLoader, Math.max(0, 3800 - elapsed));
      }, { once: true });
    }());
  </script>
